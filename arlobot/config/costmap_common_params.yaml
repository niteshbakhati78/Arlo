# Core Costmap Settings
obstacle_range: 2.5  
raytrace_range: 3.0  
transform_tolerance: 0.2  
map_type: costmap 
# Robot Geometry
robot_radius: 0.17 
# footprint: [[-0.17, -0.17], [-0.17, 0.17], [0.17, 0.17], [0.17, -0.17]] # Uncomment if using polygon
inflation_radius: 0.3 
# Frame IDs (Critical for TF Consistency)
base_frame: base_link  
global_frame: map 
# Laser Configuration
observation_sources: laser_scan_sensor 
laser_scan_sensor: {
    sensor_frame: rplidar,
    data_type: LaserScan,
    topic: /scan,
    marking: true, 
    clearing: true, 
    expected_update_rate: 5.0, 
    max_obstacle_height: 0.5,
    min_obstacle_height: 0.0 
}
# Costmap Plugins (Add if missing)
plugins:
  - {name: static_layer, type: "costmap_2d::StaticLayer"}
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
